plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.websolusi.ibanknotif'
    compileSdk 34

    defaultConfig {
        applicationId "com.websolusi.ibanknotif"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.0.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    testImplementation "junit:junit:4.13.2"
    // Wajib. Tanpa ini `org.json` di unit test memakai stub dari android.jar yang
    // melempar exception, jadi setiap fromJson mengembalikan null dan semua test
    // yang menyentuh rules.json atau patterns.json gagal dengan NullPointerException.
    testImplementation "org.json:json:20231013"
}
